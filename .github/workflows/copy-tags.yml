# Copies the tags published as ghcr.io/<owner>/dropnook to the second name of
# the image, ghcr.io/<owner>/drop, without building anything: the manifests are
# copied as they are, so both names end up with the same digests.
#
#   Actions → Copy tags to the new name → Run workflow
#
# Copied are the release tags (1.2.3, 1.2, 1), :latest and :edge. A tag the new
# name already carries with the same digest is left alone, so this can be run
# again at any time; image.yml publishes every new build under both names
# anyway. Needs the package drop to exist and to give this repository the
# Admin or Write role (Packages → drop → Package settings → Manage Actions
# access).
name: Copy tags to the new name

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only list what would be copied"
        type: boolean
        default: false

permissions:
  packages: write

concurrency:
  group: copy-tags
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      FROM: ghcr.io/${{ github.repository_owner }}/dropnook
      TO: ghcr.io/${{ github.repository_owner }}/drop
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          from=${FROM,,} to=${TO,,}
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest || true; }

          # Every tag of the old name, a page at a time.
          repo=${from#ghcr.io/}
          token=$(curl -fsS -u "$GITHUB_ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull" | jq -r .token)
          tags= last=
          while :; do
            page=$(curl -fsS -H "Authorization: Bearer $token" \
              "https://ghcr.io/v2/$repo/tags/list?n=100${last:+&last=$last}" | jq -r '.tags[]?')
            tags+="$page"$'\n'
            [ "$(grep -c . <<<"$page")" = 100 ] || break
            last=$(tail -n 1 <<<"$page")
          done
          tags=$(grep -xE 'latest|edge|[0-9]+(\.[0-9]+){0,2}' <<<"$tags" | sort -uV || true)
          [ -n "$tags" ] || { echo "::error::No tags found for $from"; exit 1; }

          failed=0
          for tag in $tags; do
            want=$(digest "$from:$tag")
            [ -n "$want" ] || { echo "::error::Cannot read $from:$tag"; failed=1; continue; }
            if [ "$(digest "$to:$tag")" = "$want" ]; then
              echo "same    :$tag  $want"
            elif [ "$DRY_RUN" = true ]; then
              echo "to copy :$tag  $want"
            else
              docker buildx imagetools create --tag "$to:$tag" "$from:$tag" > /dev/null
              got=$(digest "$to:$tag")
              if [ "$got" = "$want" ]; then
                echo "copied  :$tag  $want"
              else
                echo "::error::$to:$tag is $got, expected $want"; failed=1
              fi
            fi
          done
          exit $failed
