# Tests the Drop image and publishes it to the GitHub Container Registry,
# under two names that always carry the same tags and the same digests:
#
#   ghcr.io/<owner>/drop       the name new installations use
#   ghcr.io/<owner>/dropnook   the name before the app was renamed. Existing
#                              installations pull it and would silently stop
#                              getting updates without it: never remove it.
#
#   Actions → Image → Run workflow, version 1.2.3
#                             →  <both names>:1.2.3, :1.2, :1, :latest,
#                                then tag v1.2.3 and a GitHub release for it
#   release v1.2.3 published  →  the same images (for releases made by hand)
#   push to main              →  <both names>:edge
#   Run workflow on a branch  →  <both names>:<branch>, to try it out
#   every Sunday              →  the latest release rebuilt on a fresh base image,
#                                for its security updates: :1.2, :1, :latest
#                                (:1.2.3 stays as released). Skipped when the base
#                                image has not changed since the last build.
#                                By hand: Run workflow with "rebuild" ticked.
#
# Nothing is published unless .github/smoke-test.sh passes against the image.
#
# A package is private when it is first published; set it to public once
# (Packages → <name> → Package settings → Change visibility).
name: Image

on:
  release:
    types: [published]
  push:
    branches: [main]
  schedule:
    # Sundays 01:17 UTC: security updates of the base image. Sunday, and early,
    # because Unraid's weekly check for container updates runs on Monday at 00:10
    # local time — anywhere in the world that is after this, even when GitHub
    # starts the job hours late. A Monday rebuild was seen a week later.
    - cron: "17 1 * * 0"
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version, e.g. 1.2.3 (empty: just build the branch)"
        required: false
        default: ""
      rebuild:
        description: "Rebuild the latest release on a fresh base image (security updates)"
        type: boolean
        default: false

permissions:
  contents: write          # only used to create the tag and release
  packages: write

concurrency:
  group: image-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/drop
      IMAGE_OLD: ghcr.io/${{ github.repository_owner }}/dropnook   # for good, see above
      BASE: python:3.13-slim           # keep in step with FROM in the Dockerfile
      RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
      SCHEDULED: ${{ github.event_name == 'schedule' || inputs.rebuild == true }}
    steps:
      - name: Which release to rebuild
        if: env.SCHEDULED == 'true'
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -z "$RELEASE_TAG" ] || { echo "::error::Either a version or rebuild, not both"; exit 1; }
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "Latest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The code to build: the latest release when scheduled, else this commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.latest.outputs.tag || github.sha }}

      # What the labels say: the commit and version actually built.
      - name: Source
        id: src
        env:
          VERSION: ${{ env.RELEASE_TAG || steps.latest.outputs.tag }}
        run: |
          # Checked before it goes anywhere: one line, exactly v1.2.3.
          [[ -z $VERSION || $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Version must look like 1.2.3"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"; fi

      # The test script as it is now — an older release may not have it yet —
      # and the compose.yaml people copy today, which it checks too.
      - uses: actions/checkout@v5
        with:
          path: ci
          sparse-checkout: |
            .github
            compose-projects-drop

      - name: Check the version
        if: env.RELEASE_TAG != ''
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Version must look like 1.2.3"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            echo "::error::$RELEASE_TAG exists already"; exit 1
          fi

      - name: Check the code
        run: |
          python3 -m py_compile main.py healthcheck.py
          sh -n entrypoint.sh
          for f in lang/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done

      - name: Base image
        id: base
        run: |
          for attempt in 1 2 3; do
            digest=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest}}' | jq -r .digest) && break
            sleep 20
          done
          [ -n "$digest" ] || { echo "::error::Cannot read the digest of $BASE"; exit 1; }
          echo "$BASE is $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Anything new?
        if: env.SCHEDULED == 'true'
        id: fresh
        run: |
          built=$(docker buildx imagetools inspect "${IMAGE_OLD,,}:latest" \
            --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.base.digest" }}' \
            2>/dev/null || true)
          if [ "$built" = "${{ steps.base.outputs.digest }}" ] && [ "${{ github.event_name }}" = schedule ]; then
            echo "The base image has not changed since the last build — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.fresh.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.fresh.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.fresh.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names are lower case, account names need not be.
      - name: Image names
        id: names
        run: printf 'images<<EOF\n%s\n%s\nEOF\n' "${IMAGE,,}" "${IMAGE_OLD,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        if: steps.fresh.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        env:
          VERSION: ${{ env.RELEASE_TAG || steps.latest.outputs.tag }}
        with:
          images: ${{ steps.names.outputs.images }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.SCHEDULED != 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || env.VERSION != '' }}
            type=edge,branch=main,enable=${{ env.SCHEDULED != 'true' && env.VERSION == '' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.version == '' && env.SCHEDULED != 'true' }}
          labels: |
            org.opencontainers.image.title=Drop
            org.opencontainers.image.description=Instant sharing for your home network, with expiring links to the internet
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.base.name=docker.io/library/${{ env.BASE }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
            ${{ steps.src.outputs.version && format('org.opencontainers.image.version={0}', steps.src.outputs.version) || '' }}

      # Before anything is built: every tag is there for both names.
      - name: Both names
        if: steps.fresh.outputs.skip != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          new=$(sed -n "s|^${IMAGE,,}:||p" <<<"$TAGS" | sort)
          old=$(sed -n "s|^${IMAGE_OLD,,}:||p" <<<"$TAGS" | sort)
          [ -n "$new" ] && [ "$new" = "$old" ] \
            || { echo "::error::${IMAGE,,} and ${IMAGE_OLD,,} must carry the same tags"; exit 1; }

      # First for this machine only, to test it; the cache makes the real
      # build below reuse every layer of it.
      - name: Build for the test
        if: steps.fresh.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: drop:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        if: steps.fresh.outputs.skip != 'true'
        run: bash ci/.github/smoke-test.sh drop:ci

      - name: Build and publish
        if: steps.fresh.outputs.skip != 'true'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only after the images are out. A release created with GITHUB_TOKEN does
      # not start this workflow a second time.
      - name: Create the tag and release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .github/release-notes/v1.2.3.md, if there, goes above the generated changelog.
          notes=".github/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "Drop ${RELEASE_TAG#v}" --generate-notes "$@"

      # Last, so that a registry hiccup here cannot leave a release half made.
      # Every tag this run wrote belongs to this run alone: a release does not
      # write :edge (the push of the same commit does), or the two runs, started
      # moments apart, would overwrite each other's :edge and fail this check.
      - name: Both names, one image
        if: steps.fresh.outputs.skip != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          for ref in $TAGS; do
            got=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$ref  $got"
            [ "$got" = "$DIGEST" ] || { echo "::error::$ref is not $DIGEST"; exit 1; }
          done
